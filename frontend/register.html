<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0747ac">
  <meta name="description" content="Penjualan jamur dan pengelolaan pertanian serta peternakan Desa Dlingo.">
  <title>Daftar — Desa Dlingo</title>
  <link rel="stylesheet" href="css/replica.css">
  <script defer src="js/demo-store.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/pages/register.js"></script>
</head>
<body class="auth-page" data-page="register" data-shell="auth">
  <a class="skip-link" href="#app-main">Lewati ke konten utama</a>
  <div class="top-band"></div><main class="auth-main register-main" id="app-main" tabindex="-1"><section class="auth-card wide" aria-labelledby="register-heading">
    <div class="auth-logo" id="register-logo"></div><h1 id="register-heading">Buat Akun Baru</h1><p class="auth-subtitle">Bergabung dengan pertanian Desa Dlingo</p>
    <form id="register-form"><div class="role-picker" role="group" aria-label="Jenis akun"><label class="role-option"><input name="role" type="radio" value="pembeli" checked> Pembeli</label><label class="role-option"><input name="role" type="radio" value="petani"> Petani</label></div>
    <div id="register-fields"></div><p class="form-error" role="alert" hidden></p><button class="button" type="submit">Daftar</button></form>
    <p class="auth-footer">Sudah punya akun? <a href="login.html">Masuk</a></p><span class="auth-watermark" id="register-watermark"></span>
  </section></main>
</body>
</html>
