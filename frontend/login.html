<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0747ac">
  <meta name="description" content="Penjualan jamur dan pengelolaan pertanian serta peternakan Desa Dlingo.">
  <title>Masuk — Desa Dlingo</title>
  <link rel="stylesheet" href="css/replica.css">
  <script defer src="js/demo-store.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/pages/login.js"></script>
</head>
<body class="auth-page" data-page="login" data-shell="auth">
  <a class="skip-link" href="#app-main">Lewati ke konten utama</a>
  <div class="top-band"></div><main class="auth-main" id="app-main" tabindex="-1">
    <section class="auth-card" aria-labelledby="login-heading">
      <div class="auth-logo" id="login-logo"></div>
      <h1 id="login-heading">Dashboard Peternakan</h1>
      <p class="auth-subtitle">Masuk ke akun Anda</p>
      <form id="login-form">
        <div class="field"><label for="username">Username</label><div class="input-wrap"><span id="username-icon"></span><input class="input" id="username" name="username" placeholder="Masukkan username" autocomplete="username" required autofocus></div></div>
        <div class="field"><label for="password">Kata Sandi</label><div class="input-wrap"><span id="password-icon"></span><input class="input" id="password" name="password" type="password" placeholder="Masukkan kata sandi" autocomplete="current-password" required></div></div>
        <label class="check-label"><input type="checkbox" name="remember"> Ingat saya</label>
        <p class="form-error" role="alert" hidden></p>
        <button class="button" type="submit"><span id="submit-icon"></span>Masuk</button>
      </form>
      <p class="auth-footer">Belum punya akun? <a href="register.html">Daftar</a></p>
      <span class="auth-watermark" id="login-watermark"></span>
    </section>
  </main>
</body>
</html>
