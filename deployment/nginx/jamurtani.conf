# Include inside nginx's http {} context. Replace every __PLACEHOLDER__ first.
# Log paths without query strings and redact reset tokens from URL paths.
map $uri $jamurtani_log_uri {
    default $uri;
    ~^/reset-password/ /reset-password/[redacted];
    ~^/email/verify/ /email/verify/[redacted];
}
log_format jamurtani '$remote_addr - $remote_user [$time_local] "$request_method $jamurtani_log_uri $server_protocol" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=jamurtani_edge:10m rate=10r/s;

server {
    listen 80;
    server_name __DOMAIN__;
    if ($host != "__DOMAIN__") { return 444; }
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://__DOMAIN__$request_uri; }
}
server {
    listen 443 ssl;
    server_name __DOMAIN__;
    if ($host != "__DOMAIN__") { return 444; }
    root __APP_ROOT__/public;
    index index.php;
    ssl_certificate __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    autoindex off;
    client_max_body_size 3m;
    client_body_timeout 15s;
    access_log /var/log/nginx/jamurtani-access.log jamurtani;
    # Nginx errors can contain raw request URIs. Capture application errors in Laravel;
    # keep startup/config errors in the protected system log, not a per-site request log.
    error_log /dev/null crit;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    limit_req_status 429;
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type text/plain;
        add_header Retry-After 60 always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 429 "Too many requests. Please retry later.\n";
    }
    location / {
        limit_req zone=jamurtani_edge burst=30 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ^~ /storage/ {
        # Stop all executable/hidden content in the public upload tree.
        location ~* \.(?:php[0-9]?|phtml|phar|html?|svg|js|css|sh|cgi|pl)(?:/|$) { deny all; }
        location ~ /\. { deny all; }
        try_files $uri =404;
    }
    location ~ /\.(?!well-known(?:/|$)) { deny all; }
    location = /index.php {
        internal;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_HOST __DOMAIN__;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:__PHP_FPM_SOCKET__;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }
    location ~ \.php(?:/|$) { return 404; }
}
